<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6f8f78">
<link rel="manifest" href="manifest.webmanifest">
<title>読書記録</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{margin:0;background:#f7f6f0;color:#303630;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:#6f8f78;color:white;padding:18px 16px} header h1{margin:0;font-size:22px}
main{max-width:760px;margin:auto;padding:14px}.card{background:white;border:1px solid #dfe4dc;border-radius:14px;padding:14px;margin-bottom:14px}
button{border:0;border-radius:10px;padding:11px 14px;background:#6f8f78;color:white;font-weight:700;margin:4px}
button.secondary{background:#e9eee9;color:#303630}button.danger{background:#b85d5d}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd4cc;border-radius:9px;font:inherit}
textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-weight:700;margin:8px 0 4px}.hidden{display:none!important}
.meta,.notice{color:#687068;font-size:13px}.summary{white-space:pre-wrap;line-height:1.6;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1f4ef;padding:10px;border-radius:10px}.stat b{display:block;font-size:20px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📚 読書記録</h1></header>
<main>
<section class="card">
<button onclick="startScanner()">📷 本のバーコードを読み取る</button>
<button class="secondary" onclick="showForm()">✏️ 手入力</button>
<div id="reader" class="hidden"></div>
<p class="notice">ISBN-13（978/979）のバーコードを読み取ります。カメラ利用にはHTTPSが必要です。</p>
</section>

<section id="formCard" class="card hidden">
<h2 id="formTitle">本を追加</h2>
<div class="grid">
<div class="full"><label>タイトル</label><input id="title"></div>
<div><label>著者</label><input id="author"></div>
<div><label>出版社</label><input id="publisher"></div>
<div><label>ISBN</label><input id="isbn"></div>
<div><label>登録日</label><input id="date" type="date"></div>
<div><label>読書状況</label><select id="status"><option>未読</option><option>読書中</option><option>読了</option></select></div>
<div><label>評価</label><select id="rating"><option value="0">未評価</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div>
<div><label>タグ</label><input id="tags" placeholder="例：小説,仕事,歴史"></div>
<div class="full"><label>概要説明</label><textarea id="summary"></textarea>
<p class="notice">書籍概要はopenBDの「内容紹介」を自動取得します。Amazonの概要を直接自動取得するにはAmazon公式APIとバックエンドが必要です。</p></div>
<div class="full"><label>備考・所感</label><textarea id="notes"></textarea></div>
</div>
<button onclick="saveBook()">保存</button><button class="secondary" onclick="cancelForm()">キャンセル</button>
</section>

<section class="card"><div class="stats">
<div class="stat"><b id="count">0</b>冊</div><div class="stat"><b id="unread">0</b>未読</div><div class="stat"><b id="done">0</b>読了</div>
</div></section>

<section class="card"><label>検索</label><input id="search" placeholder="タイトル・著者・出版社・ISBN・タグ・概要・所感"></section>
<section id="list"></section>
</main>

<script>
const KEY="reading-record-v2";
let books=JSON.parse(localStorage.getItem(KEY)||"[]"),editId=null,scanner=null;
const today=()=>new Date().toISOString().slice(0,10);
function showForm(b=null){
 document.getElementById("formCard").classList.remove("hidden");editId=b?.id||null;
 document.getElementById("formTitle").textContent=b?"本を編集":"本を追加";
 ["title","author","publisher","isbn","summary","notes","tags"].forEach(id=>document.getElementById(id).value=b?.[id]||"");
 document.getElementById("date").value=b?.date||today();document.getElementById("status").value=b?.status||"未読";document.getElementById("rating").value=b?.rating||0;
}
function cancelForm(){document.getElementById("formCard").classList.add("hidden");editId=null}
function saveBook(){
 const b={id:editId||crypto.randomUUID(),title:title.value.trim(),author:author.value.trim(),publisher:publisher.value.trim(),isbn:isbn.value.replace(/[-\s]/g,""),date:date.value,status:status.value,rating:+rating.value,tags:tags.value.trim(),summary:summary.value.trim(),notes:notes.value.trim()};
 if(!b.title){alert("タイトルを入力してください");return}
 const dup=books.find(x=>x.isbn&&b.isbn&&x.isbn===b.isbn&&x.id!==b.id);
 if(dup&&!confirm("同じISBNの本が既にあります。登録しますか？"))return;
 const i=books.findIndex(x=>x.id===b.id);i>=0?books[i]=b:books.push(b);persist();cancelForm();render();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(books))}
async function lookupISBN(code){
 const no=code.replace(/[-\s]/g,"");isbn.value=no;
 try{
  const r=await fetch("https://api.openbd.jp/v1/get?isbn="+encodeURIComponent(no)),d=await r.json(),x=d?.[0],s=x?.summary||{},on=x?.onix||{};
  if(!x){alert("書誌情報が見つかりません。手入力してください。");showForm();return}
  title.value=s.title||"";author.value=s.author||"";publisher.value=s.publisher||"";
  const tc=on?.CollateralDetail?.TextContent;
  summary.value=Array.isArray(tc)?tc.map(v=>v?.Text||"").filter(Boolean).join("\n"):"";
  showForm();
 }catch(e){alert("書誌情報を取得できませんでした。手入力してください。");showForm()}
}
async function startScanner(){
 const r=document.getElementById("reader");
 if(scanner)return;
 if(typeof Html5Qrcode === "undefined"){
  alert("バーコード読み取り機能の読み込みに失敗しました。通信状態を確認して、ページを再読み込みしてください。");
  return;
 }
 r.classList.remove("hidden");
 try{
  scanner=new Html5Qrcode("reader");
  await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:120}},async t=>{
   if(/^97[89]\d{10}$/.test(t)){
    await scanner.stop();scanner=null;r.classList.add("hidden");lookupISBN(t);
   }
  },()=>{});
 }catch(e){
  try{if(scanner)await scanner.clear()}catch(_){}
  scanner=null;r.classList.add("hidden");
  alert("カメラを起動できません。Chromeのカメラ権限とHTTPS接続を確認してください。\n\n"+(e?.message||""));
 }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function delBook(id){if(confirm("削除しますか？")){books=books.filter(b=>b.id!==id);persist();render()}}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const a=books.filter(b=>Object.values(b).join(" ").toLowerCase().includes(q)).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 count.textContent=books.length;unread.textContent=books.filter(b=>b.status==="未読").length;done.textContent=books.filter(b=>b.status==="読了").length;
 list.innerHTML=a.length?"":"<div class='card'>まだ本がありません。</div>";
 a.forEach(b=>{
  const amazon="https://www.amazon.co.jp/s?k="+encodeURIComponent(b.isbn||b.title),el=document.createElement("div");el.className="card";
  el.innerHTML="<h3>"+esc(b.title)+"</h3><div class='meta'>"+esc(b.author)+" / "+esc(b.publisher)+"</div><div class='meta'>登録日："+esc(b.date)+"　"+esc(b.status)+"　"+"★".repeat(b.rating||0)+"</div>"+
   (b.summary?"<div class='summary'><b>概要</b><br>"+esc(b.summary)+"</div>":"")+(b.notes?"<div class='summary'><b>所感</b><br>"+esc(b.notes)+"</div>":"")+
   "<button class='secondary' onclick='window.open("+JSON.stringify(amazon)+","_blank")'>Amazonで見る</button>"+
   "<button onclick='editById("+JSON.stringify(b.id)+")'>編集</button><button class='danger' onclick='delBook("+JSON.stringify(b.id)+")'>削除</button>";
  list.appendChild(el);
 });
}
function editById(id){showForm(books.find(b=>b.id===id))}
document.getElementById("search").addEventListener("input",render);render();
</script>
</body></html>
